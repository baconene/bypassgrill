name: Android POS APK
on:
  workflow_dispatch:
  push:
    branches: [feature/android-pos-app]
    paths: ['android-app/**','.github/workflows/android-apk.yml']
concurrency:
  group: android-pos-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx expo prebuild --platform android --non-interactive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build standalone release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease
      - name: Verify embedded JS bundle
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -E 'index\.android\.bundle|assets/.*\.bundle' || {
            echo "Release APK does not contain an embedded JS bundle"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: bypass-grill-pos-release-apk
          path: android-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  publish:
    if: github.repository == 'baconene/bypassgrill' && github.ref == 'refs/heads/feature/android-pos-app'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bypass-grill-pos-release-apk
          path: apk
      - name: Publish the direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          mv apk/app-release.apk apk/bypass-grill-pos.apk
          if gh release view android-pos > /dev/null 2>&1; then
            gh release upload android-pos apk/bypass-grill-pos.apk --clobber
          else
            gh release create android-pos apk/bypass-grill-pos.apk \
              --target "$BUILD_SHA" --title "Bypass Grill Android POS" \
              --notes "Latest verified Android POS build from the Android POS APK workflow." \
              --prerelease --latest=false
          fi
